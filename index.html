<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distri-Port V7 | Auto-Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .stock-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-slate-100 font-sans min-h-screen pb-20 text-slate-900">

    <div id="login-overlay" class="fixed inset-0 z-[200] flex items-center justify-center bg-slate-900">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-85 text-center border-t-4 border-blue-600">
            <h2 class="text-2xl font-black mb-6 uppercase tracking-tight">System Locked</h2>
            <input type="password" id="access-code" placeholder="Password: Field2026" class="w-full p-4 border rounded-2xl mb-4 text-center outline-none focus:ring-2 focus:ring-blue-500 border-slate-200">
            <button id="login-btn" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold hover:bg-blue-700 shadow-lg">Enter Dashboard</button>
        </div>
    </div>

    <div class="max-w-7xl mx-auto p-4 md:p-8">
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 bg-white p-6 rounded-3xl shadow-md border border-slate-200 gap-4">
            <div class="text-center md:text-left">
                <h1 class="text-2xl font-black italic">DISTRI-PORT <span class="text-blue-600">V7</span></h1>
                <p class="text-slate-500 text-[10px] font-black uppercase tracking-[0.2em] mt-1">Smart Inventory Deduction Enabled</p>
            </div>
            <div class="flex gap-2">
                <button onclick="toggleModal('dealer-modal')" class="bg-indigo-50 text-indigo-600 px-4 py-2 rounded-xl text-xs font-black uppercase">Dealers</button>
                <button onclick="toggleModal('import-modal')" class="bg-blue-50 text-blue-600 px-4 py-2 rounded-xl text-xs font-black uppercase">Import Stock</button>
                <button onclick="logout()" class="bg-slate-100 text-slate-500 px-4 py-2 rounded-xl text-xs font-black uppercase">Logout</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-8 rounded-[2.5rem] shadow-md border border-slate-200">
                    <h3 class="font-black mb-6 flex items-center gap-2 text-xl uppercase tracking-tight">📝 Punch & Deduct</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
                        <select id="dealer-select" class="w-full p-4 border rounded-2xl bg-slate-50 font-bold text-slate-700 border-slate-200"></select>
                        <div class="relative">
                            <input type="text" id="order-items" placeholder="Qty x Item (e.g. 5x SSD)" class="w-full p-4 border rounded-2xl bg-slate-50 border-slate-200 font-bold">
                            <span class="absolute right-3 top-4 text-[10px] font-black text-blue-400 bg-blue-50 px-2 py-1 rounded-lg uppercase">Auto-Sync</span>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div class="relative">
                            <input type="number" id="order-amt" placeholder="Total Value (₹)" class="w-full p-4 border rounded-2xl bg-slate-50 border-slate-200 font-bold pr-12">
                            <button onclick="toggleModal('calc-modal')" class="absolute right-3 top-3 bg-slate-200 p-2 rounded-lg">🧮</button>
                        </div>
                        <button id="save-order" class="w-full bg-blue-600 text-white rounded-2xl font-black shadow-xl active:scale-95 transition-all uppercase text-sm">Punch Order</button>
                    </div>
                </div>

                <div class="bg-white rounded-[2.5rem] shadow-md border border-slate-200 overflow-hidden">
                    <div class="p-6 bg-slate-50 border-b flex justify-between items-center">
                        <span class="font-black uppercase tracking-tight">Live Order Log</span>
                        <div class="flex gap-2">
                            <button id="export-csv" class="bg-emerald-600 text-white px-4 py-2 rounded-xl text-xs font-black uppercase">Export CSV</button>
                            <button onclick="clearOrders()" class="bg-red-50 text-red-600 px-4 py-2 rounded-xl text-xs font-black uppercase">Reset</button>
                        </div>
                    </div>
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-100 text-slate-400 uppercase text-[10px] font-black">
                            <tr><th class="p-5">Time</th><th class="p-5">Dealer</th><th class="p-5">Details</th><th class="p-5 text-right">Bill Amount</th></tr>
                        </thead>
                        <tbody id="orders-body" class="divide-y divide-slate-100 font-bold"></tbody>
                    </table>
                </div>
            </div>

            <div class="bg-white p-7 rounded-[2.5rem] shadow-md border border-slate-200 h-fit sticky top-8">
                <h3 class="font-black mb-5 text-xl uppercase tracking-tight">📦 Stock Levels</h3>
                <input type="text" id="stock-search" placeholder="Search item..." class="w-full p-4 border rounded-2xl bg-slate-50 outline-none border-slate-200 font-bold text-sm mb-6">
                <ul id="stock-list" class="space-y-4 max-h-[600px] overflow-y-auto no-scrollbar"></ul>
            </div>
        </div>
    </div>

    <div id="calc-modal" class="fixed inset-0 z-[150] bg-slate-900/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-xs rounded-[2.5rem] p-8 shadow-2xl text-center">
            <h3 class="font-black text-xl mb-6 uppercase">Quick Calculator</h3>
            <div class="space-y-4">
                <input type="number" id="calc-rate" placeholder="Rate (₹)" class="w-full p-4 border rounded-2xl bg-slate-50 font-bold text-center border-slate-200">
                <input type="number" id="calc-qty" placeholder="Quantity" class="w-full p-4 border rounded-2xl bg-slate-50 font-bold text-center border-slate-200">
                <div class="bg-blue-50 p-4 rounded-2xl">
                    <p id="calc-result" class="text-2xl font-black text-blue-600">₹0</p>
                </div>
                <div class="flex gap-2">
                    <button onclick="toggleModal('calc-modal')" class="flex-1 py-4 bg-slate-100 rounded-2xl font-bold text-slate-500 text-xs">CLOSE</button>
                    <button onclick="applyCalc()" class="flex-1 py-4 bg-blue-600 text-white rounded-2xl font-bold text-xs shadow-lg">APPLY</button>
                </div>
            </div>
        </div>
    </div>

    <div id="import-modal" class="fixed inset-0 z-[150] bg-slate-900/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-xl rounded-[2.5rem] p-8 shadow-2xl">
            <h3 class="font-black text-2xl mb-1">Import Inventory</h3>
            <p class="text-blue-500 text-[10px] font-black uppercase mb-4 tracking-widest">Format: Item, Qty, Price, Brand</p>
            <textarea id="import-area" rows="10" placeholder="SSD 500GB, 100, 3200, Samsung" class="w-full p-5 border rounded-3xl bg-slate-50 font-mono text-xs outline-none border-slate-200 mb-6"></textarea>
            <div class="flex gap-3">
                <button onclick="toggleModal('import-modal')" class="flex-1 py-4 bg-slate-100 rounded-2xl font-black text-slate-500 text-xs">CANCEL</button>
                <button onclick="runImport()" class="flex-1 py-4 bg-blue-600 text-white rounded-2xl font-black text-xs">SAVE STOCK</button>
            </div>
        </div>
    </div>

    <div id="dealer-modal" class="fixed inset-0 z-[150] bg-slate-900/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl">
            <h3 class="font-black text-2xl mb-6 uppercase text-center">Dealer List</h3>
            <div class="flex gap-2 mb-6">
                <input type="text" id="new-dealer-name" placeholder="Shop Name" class="flex-1 p-4 border rounded-2xl bg-slate-50 text-sm outline-none font-bold">
                <button onclick="addDealer()" class="bg-blue-600 text-white px-6 py-2 rounded-2xl font-black">+</button>
            </div>
            <div id="dealer-manage-list" class="max-h-64 overflow-y-auto space-y-3 mb-8 no-scrollbar"></div>
            <button onclick="toggleModal('dealer-modal')" class="w-full py-4 bg-slate-100 rounded-2xl font-black text-slate-500 text-xs">CLOSE</button>
        </div>
    </div>

    <script>
        const AUTH_KEY = "Field2026";
        if(sessionStorage.getItem("auth_v7") === "true") document.getElementById("login-overlay").classList.add("hidden");
        document.getElementById("login-btn").onclick = () => {
            if(document.getElementById("access-code").value === AUTH_KEY) {
                sessionStorage.setItem("auth_v7", "true");
                document.getElementById("login-overlay").classList.add("hidden");
            }
        };
        const logout = () => { sessionStorage.clear(); location.reload(); };

        // DATA STORE
        const getDealers = () => JSON.parse(localStorage.getItem("v7_dealers") || '["New Dealer"]');
        const getStock = () => JSON.parse(localStorage.getItem("v7_stock") || '[]');
        const getOrders = () => JSON.parse(localStorage.getItem("v7_orders") || '[]');

        // CALC
        [document.getElementById("calc-rate"), document.getElementById("calc-qty")].forEach(el => el.oninput = () => {
            const total = (parseFloat(document.getElementById("calc-rate").value) || 0) * (parseFloat(document.getElementById("calc-qty").value) || 0);
            document.getElementById("calc-result").innerText = "₹" + total.toLocaleString();
        });
        function applyCalc() {
            document.getElementById("order-amt").value = (parseFloat(document.getElementById("calc-rate").value) || 0) * (parseFloat(document.getElementById("calc-qty").value) || 0);
            toggleModal('calc-modal');
        }

        // DEALERS
        function renderDealers() {
            const ds = getDealers();
            document.getElementById("dealer-select").innerHTML = '<option value="">Select Shop...</option>' + ds.map(d => `<option value="${d}">${d}</option>`).join('');
            document.getElementById("dealer-manage-list").innerHTML = ds.map((d, i) => `
                <div class="flex justify-between items-center bg-slate-50 p-4 rounded-2xl border border-slate-100">
                    <span class="text-sm font-bold uppercase tracking-tighter">${d}</span>
                    <button onclick="deleteDealer(${i})" class="text-red-500 font-black text-[10px]">DEL</button>
                </div>`).join('');
        }
        function addDealer() {
            const n = document.getElementById("new-dealer-name").value.trim();
            if(!n) return;
            const ds = getDealers(); ds.push(n);
            localStorage.setItem("v7_dealers", JSON.stringify(ds));
            document.getElementById("new-dealer-name").value = "";
            renderDealers();
        }
        function deleteDealer(i) {
            const ds = getDealers(); ds.splice(i, 1);
            localStorage.setItem("v7_dealers", JSON.stringify(ds));
            renderDealers();
        }

        // STOCK ENGINE
        function renderStock() {
            const q = document.getElementById("stock-search").value.toLowerCase();
            const items = getStock().filter(i => i.name.toLowerCase().includes(q) || (i.brand && i.brand.toLowerCase().includes(q)));
            document.getElementById("stock-list").innerHTML = items.map((i, idx) => `
                <li class="p-4 bg-white border border-slate-200 rounded-3xl shadow-sm stock-card border-l-8 ${i.qty <= 5 ? 'border-l-red-500' : 'border-l-blue-500'}">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-[8px] font-black uppercase text-blue-500 bg-blue-50 px-2 rounded-full">${i.brand}</span>
                            <p class="text-sm font-black text-slate-800 mt-1">${i.name}</p>
                        </div>
                        <span class="text-xl font-black ${i.qty <= 5 ? 'text-red-500' : 'text-slate-800'}">${i.qty}</span>
                    </div>
                    <div class="flex justify-between items-center mt-3 pt-3 border-t border-slate-50">
                        <span class="text-xs font-bold text-slate-400">Rate: ₹${Number(i.price).toLocaleString()}</span>
                        <button onclick="deleteStock(${idx})" class="text-slate-200 hover:text-red-400 font-bold text-xs uppercase">Delete</button>
                    </div>
                </li>`).join('');
        }

        function runImport() {
            const lines = document.getElementById("import-area").value.split('\n');
            const data = lines.filter(l => l.includes(',')).map(l => {
                const p = l.split(',');
                return { name: p[0].trim(), qty: parseInt(p[1].trim()) || 0, price: p[2]?.trim() || 0, brand: p[3]?.trim() || "Gen" };
            });
            localStorage.setItem("v7_stock", JSON.stringify(data));
            toggleModal('import-modal');
            renderStock();
        }

        function deleteStock(i) {
            const s = getStock(); s.splice(i, 1);
            localStorage.setItem("v7_stock", JSON.stringify(s));
            renderStock();
        }

        // AUTO-DEDUCTION LOGIC
        document.getElementById("save-order").onclick = () => {
            const dealer = document.getElementById("dealer-select").value;
            const itemString = document.getElementById("order-items").value;
            const amt = document.getElementById("order-amt").value;
            if(!dealer || !itemString || !amt) return alert("Fill all fields!");

            // Pattern: Number followed by x followed by Item Name (e.g., 5x SSD)
            const match = itemString.match(/(\d+)\s*[xX]\s*(.+)/);
            if(match) {
                const soldQty = parseInt(match[1]);
                const soldItemName = match[2].trim().toLowerCase();
                let stock = getStock();
                let found = false;

                stock = stock.map(s => {
                    if(s.name.toLowerCase() === soldItemName) {
                        s.qty = Math.max(0, s.qty - soldQty);
                        found = true;
                    }
                    return s;
                });

                if(found) {
                    localStorage.setItem("v7_stock", JSON.stringify(stock));
                    renderStock();
                } else {
                    alert("⚠️ Item not found in stock. Order punched but stock not deducted.");
                }
            }

            const os = getOrders();
            os.unshift({ dealer, items: itemString, amt, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
            localStorage.setItem("v7_orders", JSON.stringify(os));
            document.getElementById("order-items").value = "";
            document.getElementById("order-amt").value = "";
            renderOrders();
        };

        function renderOrders() {
            const os = getOrders();
            document.getElementById("orders-body").innerHTML = os.map(o => `
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="p-5 text-[10px] text-slate-400 font-black tracking-tighter">${o.time}</td>
                    <td class="p-5 uppercase tracking-tighter">${o.dealer}</td>
                    <td class="p-5 text-slate-500">${o.items}</td>
                    <td class="p-5 text-right font-black text-blue-600">₹${Number(o.amt).toLocaleString()}</td>
                </tr>`).join('');
        }

        function clearOrders() { if(confirm("Clear queue?")) { localStorage.removeItem("v7_orders"); renderOrders(); } }
        function toggleModal(id) { document.getElementById(id).classList.toggle("hidden"); }
        document.getElementById("stock-search").oninput = renderStock;
        document.getElementById("export-csv").onclick = () => {
            let csv = "Time,Dealer,Items,Amount\n";
            getOrders().forEach(o => csv += `${o.time},${o.dealer},"${o.items}",${o.amt}\n`);
            const blob = new Blob([csv], { type: 'text/csv' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Report.csv`;
            link.click();
        };

        window.onload = () => { renderDealers(); renderStock(); renderOrders(); };
    </script>
</body>
</html>
