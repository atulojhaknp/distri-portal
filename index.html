<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distri-Port Lite v1.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        #login-overlay { transition: opacity 0.4s ease; }
    </style>
</head>
<body class="bg-slate-50 font-sans min-h-screen">

    <div id="login-overlay" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-80 text-center">
            <div class="mb-4 text-4xl">🔐</div>
            <h2 class="text-xl font-bold text-slate-800 mb-2">Sales Portal</h2>
            <p class="text-sm text-slate-500 mb-6">Enter access code</p>
            <input type="password" id="access-code" placeholder="Password" class="w-full p-3 border rounded-lg mb-4 text-center outline-none focus:ring-2 focus:ring-blue-500">
            <button id="login-btn" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700">Login</button>
            <p id="login-error" class="text-red-500 text-xs mt-3 hidden">❌ Invalid Password</p>
        </div>
    </div>

    <div class="max-w-6xl mx-auto p-4 md:p-8">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">Field Sales Portal</h1>
                <p class="text-sm text-slate-500">Kanpur Distribution Hub</p>
            </div>
            <button id="logout-btn" class="text-xs bg-slate-200 px-3 py-1 rounded hover:bg-slate-300 text-slate-600">Logout</button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="font-bold text-slate-700 mb-4 flex items-center gap-2"><span>📝</span> New Order Entry</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <select id="dealer-select" class="p-3 border rounded-lg bg-slate-50 outline-none">
                            <option value="">Select Dealer...</option>
                            <option>Tech World Solutions</option>
                            <option>Global IT Systems</option>
                            <option>Vikas Computers</option>
                        </select>
                        <input type="text" id="order-items" placeholder="Items (e.g. 5x RAM)" class="p-3 border rounded-lg bg-slate-50 outline-none">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <input type="number" id="order-amt" placeholder="Total Amount (₹)" class="p-3 border rounded-lg bg-slate-50 outline-none">
                        <button id="save-order" class="bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700">Save Order</button>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-4 bg-slate-50 border-b flex justify-between items-center">
                        <span class="font-bold text-slate-700">Pending Queue</span>
                        <button id="export-csv" class="bg-emerald-600 text-white text-xs px-4 py-2 rounded font-bold hover:bg-emerald-700">Download CSV</button>
                    </div>
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-100 text-slate-500 uppercase text-[10px]">
                            <tr><th class="p-4">Time</th><th class="p-4">Dealer</th><th class="p-4">Details</th><th class="p-4">Amount</th><th class="p-4">Status</th></tr>
                        </thead>
                        <tbody id="orders-body" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-fit sticky top-8">
                <h3 class="font-bold text-slate-700 mb-4">📦 Live Stock</h3>
                <input type="text" id="stock-search" placeholder="Search..." class="w-full p-3 border rounded-lg mb-4 bg-slate-50 outline-none">
                <ul id="stock-list" class="space-y-3 text-sm"></ul>
            </div>
        </div>
    </div>

    <script>
        const PASS = "Field2026";
        const inventory = [
            { name: "Crucial 8GB DDR4 RAM", stock: 45 },
            { name: "WD 500GB NVMe SSD", stock: 12 },
            { name: "H61 Motherboard", stock: 0 }
        ];

        // Auth Logic
        if(sessionStorage.getItem("auth") === "true") document.getElementById("login-overlay").style.display = "none";
        document.getElementById("login-btn").onclick = () => {
            if(document.getElementById("access-code").value === PASS) {
                sessionStorage.setItem("auth", "true");
                document.getElementById("login-overlay").style.display = "none";
            } else {
                document.getElementById("login-error").classList.remove("hidden");
            }
        };

        // Render functions
        const renderStock = (list) => {
            document.getElementById("stock-list").innerHTML = list.map(i => `
                <li class="flex justify-between border-b pb-2">
                    <span>${i.name}</span>
                    <span class="font-bold ${i.stock <= 5 ? 'text-red-500' : 'text-green-600'}">${i.stock}</span>
                </li>`).join('');
        };
        renderStock(inventory);

        document.getElementById("save-order").onclick = () => {
            const dealer = document.getElementById("dealer-select").value;
            const details = document.getElementById("order-items").value;
            const amt = document.getElementById("order-amt").value;
            if(!dealer || !details || !amt) return alert("Fill all fields!");

            const orders = JSON.parse(localStorage.getItem("orders") || "[]");
            orders.unshift({ dealer, details, amt, time: new Date
